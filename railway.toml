# Railway config-as-code — force Docker build with Playwright/Chromium
# Docs: https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "Dockerfile",
  ".dockerignore",
  "requirements.txt",
  "main.py",
  "app.py",
  "pyproject.toml",
  "templates/**",
  "static/**",
  "*.py",
]

[deploy]
startCommand = "python main.py"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
